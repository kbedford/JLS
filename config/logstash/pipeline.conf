input {
  udp { port => 5514 buffer_size => 65536 source_ip_fieldname => "source_ip" }
  tcp { port => 5514 mode => "server" codec => line }
}
filter {
  if [@metadata][input][tcp][source][ip] {
    mutate { copy => { "[@metadata][input][tcp][source][ip]" => "source_ip" } }
  }
  # Keep the input @timestamp unchanged: it is persisted before filter/output.
  # The receiver derives a stable replay ID from receipt timestamp, source and message.
}
output {
  http {
    url => "http://scanner:8080/events"
    http_method => "post"
    format => "json"
    headers => { "Authorization" => "Bearer ${INGEST_TOKEN}" }
    pool_max => 4
    pool_max_per_route => 4
    retry_failed => true
    retryable_codes => [400, 401, 403, 404, 408, 413, 429, 500, 502, 503, 504]
    retry_non_idempotent => true
    automatic_retries => 2
    connect_timeout => 5
    socket_timeout => 30
    request_timeout => 60
  }
}
