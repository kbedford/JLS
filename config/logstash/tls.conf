# Optional newline-delimited syslog over mutual TLS; loaded by compose.tls.yml.
input {
  tcp {
    port => 6514
    mode => "server"
    codec => line
    ssl_enabled => true
    ssl_certificate => "/certs/server.crt"
    ssl_key => "/certs/server.pkcs8.key"
    ssl_certificate_authorities => ["/certs/ca.crt"]
    ssl_client_authentication => "required"
  }
}
