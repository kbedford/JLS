name: JLS tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.9
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: jls_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          JLS_TEST_DSN: postgresql://postgres:test-only-password@localhost:5432/jls_test
      - name: Validate pipeline configuration
        run: docker run --rm -e INGEST_TOKEN=synthetic-test-token-at-least-32-characters -v "$PWD/config/logstash/pipeline.conf:/usr/share/logstash/pipeline/logstash.conf:ro" docker.elastic.co/logstash/logstash:8.19.13 --config.test_and_exit
      - name: Start isolated stack with synthetic catalogue
        run: |
          python tools/setup.py
          mkdir private-catalogue
          cp examples/catalogue.json private-catalogue/catalogue.json
          docker compose up --build -d --wait --wait-timeout 240
      - name: Check TCP ingestion
        run: |
          python -c "import socket; s=socket.create_connection(('127.0.0.1',5514)); s.sendall(b'Oct 16 12:00:00 test-router fpc1 TESTCHIP(1): parity error\n'); s.close()"
          for attempt in $(seq 1 30); do
            count=$(docker compose exec -T postgres psql -U postgres -d jls -Atc 'SELECT count(*) FROM jls.syslog_hits')
            if [ "$count" -ge 1 ]; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Stop test stack
        if: always()
        run: docker compose down -v
