name: Grafana demo captures
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/capture_grafana.py
      - .github/workflows/grafana-demo.yml
permissions:
  contents: write
concurrency:
  group: grafana-demo
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install capture browser
        run: |
          pip install playwright==1.56.0
          playwright install --with-deps chromium
      - name: Start isolated demo stack
        run: |
          python tools/setup.py
          docker compose up --build -d --wait --wait-timeout 300
      - name: Seed dummy Junos logs, verify counts and capture Grafana
        run: python tools/capture_grafana.py
      - name: Save capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grafana-demo
          path: docs/grafana/
          if-no-files-found: warn
      - name: Publish verified captures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/grafana/
          git diff --cached --quiet && exit 0
          git commit -m 'Update verified Grafana demo screenshots [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Stop isolated stack
        if: always()
        run: docker compose down -v
